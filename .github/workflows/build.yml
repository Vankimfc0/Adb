name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Giải nén mã nguồn
        run: unzip -q AdbManager.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Chấp nhận license Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        working-directory: AdbManager
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain 2>&1 | tee build.log
      - name: Tóm tắt lỗi
        if: failure()
        working-directory: AdbManager
        run: |
          grep -E '^(e|error): |What went wrong' -A2 build.log | head -60
      - uses: actions/upload-artifact@v4
        with:
          name: AdbManager-debug
          path: AdbManager/app/build/outputs/apk/debug/*.apk
